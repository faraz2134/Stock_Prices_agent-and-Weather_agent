<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Weather Assistant</title>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        :root {
            --bg-gradient: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            --chat-bg: rgba(255, 255, 255, 0.95);
            --user-msg: #667eea;
            --bot-msg: #f0f2f5;
            --text-dark: #2d3436;
        }

        body {
            font-family: 'Inter', -apple-system, sans-serif;
            background: var(--bg-gradient);
            height: 100vh;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .chat-container {
            width: 90%;
            max-width: 400px;
            background: var(--chat-bg);
            border-radius: 24px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.2);
            display: flex;
            flex-direction: column;
            height: 80vh;
            overflow: hidden;
        }

        .chat-header {
            background: white;
            padding: 20px;
            text-align: center;
            border-bottom: 1px solid #eee;
            font-weight: 700;
            color: var(--text-dark);
        }

        .chat-box {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .message {
            max-width: 85%;
            padding: 12px 16px;
            border-radius: 18px;
            font-size: 14px;
            line-height: 1.5;
        }

        .user-message {
            align-self: flex-end;
            background: var(--user-msg);
            color: white;
            border-bottom-right-radius: 4px;
        }

        .bot-message {
            align-self: flex-start;
            background: var(--bot-msg);
            color: var(--text-dark);
            border-bottom-left-radius: 4px;
        }

        .input-area {
            display: flex;
            padding: 20px;
            background: white;
            gap: 10px;
        }

        input {
            flex: 1;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 12px;
            outline: none;
        }

        button {
            background: var(--user-msg);
            color: white;
            border: none;
            padding: 0 20px;
            border-radius: 12px;
            cursor: pointer;
            font-weight: 600;
        }

        .typing {
            display: none;
            font-size: 12px;
            color: #888;
            margin-bottom: 10px;
            padding-left: 20px;
        }
    </style>
</head>
<body>

    <div class="chat-container">
        <div class="chat-header">🌤️ Weather Agent</div>
        <div class="chat-box" id="chat-box">
            <div class="message bot-message">Ask me about the weather anywhere!</div>
        </div>
        <div id="typing" class="typing">Agent is checking live data...</div>
        <div class="input-area">
            <input type="text" id="user-input" placeholder="Type a city..." autofocus>
            <button onclick="sendMessage()">Send</button>
        </div>
    </div>

    <script>
        const chatBox = document.getElementById("chat-box");
        const userInput = document.getElementById("user-input");
        const typing = document.getElementById("typing");

        userInput.addEventListener("keypress", (e) => { if (e.key === "Enter") sendMessage(); });

        async function sendMessage() {
            const text = userInput.value.trim();
            if (!text) return;

            appendMessage(text, "user-message");
            userInput.value = "";
            typing.style.display = "block";
            chatBox.scrollTop = chatBox.scrollHeight;

            try {
                const response = await fetch("/chat", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ message: text })
                });

                const data = await response.json();
                typing.style.display = "none";

                if (data.reply) {
                    appendHtmlMessage(marked.parse(data.reply), "bot-message");
                }
            } catch (error) {
                typing.style.display = "none";
                appendMessage("Error connecting to server.", "bot-message");
            }
        }

        function appendMessage(text, className) {
            const div = document.createElement("div");
            div.className = `message ${className}`;
            div.textContent = text;
            chatBox.appendChild(div);
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        function appendHtmlMessage(html, className) {
            const div = document.createElement("div");
            div.className = `message ${className}`;
            div.innerHTML = html;
            chatBox.appendChild(div);
            chatBox.scrollTop = chatBox.scrollHeight;
        }
    </script>
</body>
</html>
