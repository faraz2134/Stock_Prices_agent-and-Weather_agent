<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Weather Assistant</title>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        :root {
            --bg-gradient: linear-gradient(135deg, #74ebd5 0%, #9face6 100%);
            --chat-bg: rgba(255, 255, 255, 0.85);
            --user-msg: #007bff;
            --bot-msg: #f1f0f0;
            --text-dark: #333;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: var(--bg-gradient);
            height: 100vh;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .chat-container {
            width: 100%;
            max-width: 450px;
            background: var(--chat-bg);
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            backdrop-filter: blur(10px);
            display: flex;
            flex-direction: column;
            height: 80vh;
            overflow: hidden;
        }

        .chat-header {
            background: #ffffff;
            padding: 20px;
            text-align: center;
            border-bottom: 1px solid #ddd;
            font-size: 1.2rem;
            font-weight: bold;
            color: var(--text-dark);
            box-shadow: 0 2px 5px rgba(0,0,0,0.02);
        }

        .chat-box {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .message {
            max-width: 80%;
            padding: 12px 16px;
            border-radius: 18px;
            font-size: 0.95rem;
            line-height: 1.4;
            word-wrap: break-word;
        }

        .message p {
            margin: 0; /* Override marked.js paragraph margins */
        }

        .user-message {
            align-self: flex-end;
            background: var(--user-msg);
            color: white;
            border-bottom-right-radius: 4px;
        }

        .bot-message {
            align-self: flex-start;
            background: var(--bot-msg);
            color: var(--text-dark);
            border-bottom-left-radius: 4px;
        }

        .input-area {
            display: flex;
            padding: 15px;
            background: #ffffff;
            border-top: 1px solid #ddd;
        }

        input[type="text"] {
            flex: 1;
            padding: 12px 15px;
            border: 1px solid #ccc;
            border-radius: 25px;
            outline: none;
            font-size: 1rem;
            transition: border 0.3s;
        }

        input[type="text"]:focus {
            border-color: var(--user-msg);
        }

        button {
            background: var(--user-msg);
            color: white;
            border: none;
            border-radius: 25px;
            padding: 0 20px;
            margin-left: 10px;
            cursor: pointer;
            font-size: 1rem;
            font-weight: bold;
            transition: background 0.3s;
        }

        button:hover {
            background: #0056b3;
        }

        /* Simple loading animation */
        .typing-indicator {
            display: none;
            align-self: flex-start;
            background: var(--bot-msg);
            padding: 12px 16px;
            border-radius: 18px;
            border-bottom-left-radius: 4px;
            color: #888;
            font-size: 0.9rem;
            font-style: italic;
        }
    </style>
</head>
<body>

    <div class="chat-container">
        <div class="chat-header">
            🌤️ AI Weather Assistant
        </div>
        <div class="chat-box" id="chat-box">
            <div class="message bot-message">Hello! I'm connected to live weather data. What city are you curious about?</div>
            <div class="typing-indicator" id="typing-indicator">Agent is thinking...</div>
        </div>
        <div class="input-area">
            <input type="text" id="user-input" placeholder="e.g., What's the weather in Tokyo?" autocomplete="off" />
            <button onclick="sendMessage()">Send</button>
        </div>
    </div>

    <script>
        const chatBox = document.getElementById("chat-box");
        const userInput = document.getElementById("user-input");
        const typingIndicator = document.getElementById("typing-indicator");

        // Allow pressing "Enter" to send
        userInput.addEventListener("keypress", function(event) {
            if (event.key === "Enter") {
                sendMessage();
            }
        });

        async function sendMessage() {
            const text = userInput.value.trim();
            if (!text) return;

            // 1. Add user message to UI
            appendMessage(text, "user-message");
            userInput.value = "";

            // 2. Show typing indicator
            typingIndicator.style.display = "block";
            chatBox.appendChild(typingIndicator); // Move to bottom
            chatBox.scrollTop = chatBox.scrollHeight;

            try {
                // 3. Send to Flask Backend
                const response = await fetch("http://127.0.0.1:5000/chat", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({ message: text })
                });

                const data = await response.json();

                // 4. Hide typing indicator & show response
                typingIndicator.style.display = "none";

                if (data.reply) {
                    // Use marked.js to render any markdown (like bold text or lists)
                    const parsedHtml = marked.parse(data.reply);
                    appendHtmlMessage(parsedHtml, "bot-message");
                } else if (data.error) {
                    appendMessage("Backend Error: " + data.error, "bot-message");
                }

            } catch (error) {
                typingIndicator.style.display = "none";
                appendMessage("Network Error: Make sure your Flask backend is running on http://127.0.0.1:5000", "bot-message");
            }
        }

        function appendMessage(text, className) {
            const div = document.createElement("div");
            div.className = `message ${className}`;
            div.textContent = text;
            chatBox.appendChild(div);
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        function appendHtmlMessage(html, className) {
            const div = document.createElement("div");
            div.className = `message ${className}`;
            div.innerHTML = html;
            chatBox.appendChild(div);
            chatBox.scrollTop = chatBox.scrollHeight;
        }
    </script>
</body>
</html>
